<div class="auth-shell">
  <aside class="brand-panel">
    <a routerLink="/" class="logo-link" aria-label="BiteBox home">
      <bb-brand-logo variant="light" [height]="40" />
    </a>

    <div class="pitch">
      <h2>Good food, boxed and delivered.</h2>
      <p>Order from the places you love and follow your rider in real time.</p>
      <ul>
        @for (perk of perks; track perk.icon) {
          <li>
            <np-icon [name]="(perk.icon) | npIcon" class="mat-icon" matButtonIcon />
            <span>{{ perk.text }}</span>
          </li>
        }
      </ul>
    </div>

    <p class="copyright">&copy; {{ year }} BiteBox</p>
  </aside>

  <main class="form-panel">
    <div class="form-card">
      <router-outlet />
    </div>
  </main>
</div>
