<a class="skip-link" href="#main">Skip to content</a>
<mat-sidenav-container class="shell" autosize>
  <mat-sidenav
    #drawer
    class="sidebar"
    [mode]="isDesktop() ? 'side' : 'over'"
    [opened]="isDesktop()"
    [fixedInViewport]="!isDesktop()"
    role="navigation"
    aria-label="Panel navigation"
  >
    <div class="sidebar-brand">
      <bb-brand-logo variant="light" [height]="34" />
      <span class="panel-chip">{{ panelLabel() }}</span>
    </div>

    <mat-nav-list class="nav">
      @for (item of navItems(); track item.link) {
        <a
          mat-list-item
          [routerLink]="item.link"
          routerLinkActive="active"
          #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
          [activated]="rla.isActive"
          [attr.aria-current]="rla.isActive ? 'page' : null"
        >
          <np-icon [name]="(item.icon) | npIcon" class="mat-icon" matListItemIcon />
          <span matListItemTitle>{{ item.label }}</span>
          @if (item.badge?.(); as count) {
            <span matListItemMeta class="nav-badge" [attr.aria-label]="count + ' new'">{{ count }}</span>
          }
        </a>
      }
    </mat-nav-list>

    <div class="sidebar-footer">
      <button mat-button class="signout" (click)="logout()">
        <np-icon name="log-out" class="mat-icon" matButtonIcon />
        Sign out
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <mat-toolbar class="topbar">
      @if (!isDesktop()) {
        <button mat-icon-button (click)="drawer.toggle()" aria-label="Open navigation menu">
          <np-icon name="menu" class="mat-icon" matButtonIcon />
        </button>
        <bb-brand-logo [height]="28" />
      }
      <span class="spacer"></span>
      <bb-notification-bell />

      <button mat-button class="user-button" [matMenuTriggerFor]="userMenu">
        <span class="bb-avatar avatar" aria-hidden="true">{{ initials() }}</span>
        <span class="user-name">{{ user()?.name }}</span>
        <span class="bb-sr-only">account menu</span>
        <np-icon name="chevron-down" class="mat-icon" iconPositionEnd matButtonIcon />
      </button>
      <mat-menu #userMenu="matMenu" xPosition="before">
        <div class="menu-header" (click)="$event.stopPropagation()" role="presentation">
          <strong>{{ user()?.name }}</strong>
          <span>{{ user()?.email }}</span>
        </div>
        <mat-divider />
        <a mat-menu-item [routerLink]="profileLink()">
          <np-icon name="user-cog" class="mat-icon" matButtonIcon />
          <span>Profile</span>
        </a>
        <button mat-menu-item (click)="logout()">
          <np-icon name="log-out" class="mat-icon" matButtonIcon />
          <span>Sign out</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main id="main" class="page" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
