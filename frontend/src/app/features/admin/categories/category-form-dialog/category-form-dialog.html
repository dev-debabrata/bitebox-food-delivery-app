<h2 bbDialogTitle>{{ data ? 'Edit category' : 'New category' }}</h2>
<form [formRoot]="form">
  <div class="bb-dialog__content bb-form">
    @if (error()) {
      <div class="bb-alert error" role="alert">
        <np-icon name="circle-alert" class="mat-icon" matButtonIcon /><span>{{ error() }}</span>
      </div>
    }
    <np-text-input
      [formField]="form.name"
      label="Name"
      cdkFocusInitial
      [error]="shownError(form.name)"
    />
    <np-text-input
      [formField]="form.description"
      label="Description (optional)"
      [error]="shownError(form.description)"
    />
    <div class="bb-form-row">
      <np-text-input [formField]="form.icon" label="Icon" [error]="shownError(form.icon)" />
      <div class="bb-field">
        <np-input-number [formField]="form.sortOrder" label="Sort order" />
        <bb-field-error [field]="form.sortOrder" />
      </div>
    </div>
    <div class="icons" role="group" aria-label="Icon suggestions">
      @for (icon of icons; track icon) {
        <button
          class="bb-btn bb-btn--text bb-btn--icon"
          type="button"
          [class.picked]="model().icon === icon"
          (click)="form.icon().value.set(icon)"
          [attr.aria-label]="icon"
        >
          <np-icon [name]="icon | npIcon" />
        </button>
      }
    </div>
    <bb-image-upload [(url)]="imageUrl" label="Add a category photo" aspectRatio="1 / 1" />
    <p class="hint">
      A square photo of the food looks best on the home page. Without one, the icon is shown.
    </p>
    <np-toggle [formField]="form.isActive" label="Active (visible to restaurants and customers)" />
  </div>
  <div class="bb-dialog__actions">
    <np-button variant="soft" severity="secondary" label="Cancel" (clicked)="ref.close()" />
    <button class="bb-btn" type="submit" [disabled]="form().submitting()">
      {{ data ? 'Save' : 'Create' }}
    </button>
  </div>
</form>
