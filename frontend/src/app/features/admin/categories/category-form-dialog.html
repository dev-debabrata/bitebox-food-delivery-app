<h2 mat-dialog-title>{{ data ? 'Edit category' : 'New category' }}</h2>
<form [formRoot]="form">
  <mat-dialog-content class="bb-form">
    @if (error()) {
      <div class="bb-alert error" role="alert">
        <np-icon name="circle-alert" class="mat-icon" matButtonIcon /><span>{{ error() }}</span>
      </div>
    }
    <np-text-input
      [formField]="form.name"
      label="Name"
      cdkFocusInitial
      [error]="shownError(form.name)"
    />
    <np-text-input
      [formField]="form.description"
      label="Description (optional)"
      [error]="shownError(form.description)"
    />
    <div class="bb-form-row">
      <np-text-input
        [formField]="form.icon"
        label="Icon"
        [error]="shownError(form.icon)"
      />
      <div class="bb-field">
        <np-input-number
          [formField]="form.sortOrder"
          label="Sort order"
        />
        <bb-field-error [field]="form.sortOrder" />
      </div>
    </div>
    <div class="icons" role="group" aria-label="Icon suggestions">
      @for (icon of icons; track icon) {
        <button
          type="button"
          mat-icon-button
          [class.picked]="model().icon === icon"
          (click)="form.icon().value.set(icon)"
          [attr.aria-label]="icon"
        >
          <np-icon [name]="(icon) | npIcon" class="mat-icon" matButtonIcon />
        </button>
      }
    </div>
    <np-toggle [formField]="form.isActive" label="Active (visible to restaurants and customers)" />
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancel</button>
    <button mat-flat-button type="submit" [disabled]="form().submitting()">
      {{ data ? 'Save' : 'Create' }}
    </button>
  </mat-dialog-actions>
</form>
