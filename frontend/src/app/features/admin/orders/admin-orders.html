<bb-page-header
  title="Orders"
  subtitle="Every order on BiteBox. Open one to see its history or step in."
/>

<div class="filters">
  <np-text-input
    class="search"
    [formField]="filters.search"
    ariaLabel="Search by order number"
    placeholder="Search order number, e.g. BB-261102"
    icon="search"
    clearable
  />
  <np-select [formField]="filters.status" ariaLabel="Order status" [options]="statusOptions()" />
</div>

@if (list.error(); as message) {
  <div class="bb-alert error" role="alert">
    <np-icon name="circle-alert" class="mat-icon" matButtonIcon />
    <span>{{ message }} <button class="bb-link-button" (click)="list.load(1)">Retry</button></span>
  </div>
}

<div class="bb-card list-card" [attr.aria-busy]="list.loading()">
  @if (list.showSkeleton()) {
    @for (i of [1, 2, 3, 4, 5]; track i) {
      <span class="bb-skeleton row-skeleton"></span>
    }
  } @else if (list.empty()) {
    <bb-empty-state icon="receipt_long" title="No orders match these filters" />
  } @else {
    <ul class="rows" [class.dim]="list.loading()">
      @for (o of list.data()!.items; track o.id) {
        <li>
          <button
            type="button"
            class="row"
            (click)="open(o.id)"
          >
            <div class="main">
              <strong>{{ o.orderNumber }}</strong>
              <span class="bb-muted meta"
                >{{ o.restaurantSnapshot.name }} · {{ o | itemCount }} ·
                <span class="when">{{ o.createdAt | date: 'd MMM, h:mm a' }}</span></span
              >
            </div>
            <span class="amount">{{ o.pricing.totalPaise | inr }}</span>
            <bb-order-status-chip [status]="o.status" [label]="statusLabel(o)" />
            <np-icon name="chevron-right" class="mat-icon chev" matButtonIcon />
          </button>
        </li>
      }
    </ul>
    <mat-paginator
      [length]="list.data()!.pagination.total"
      [pageIndex]="list.data()!.pagination.page - 1"
      [pageSize]="list.data()!.pagination.limit"
      [pageSizeOptions]="[20, 50, 100]"
      (page)="list.onPage($event)"
      aria-label="Order pages"
    />
  }
</div>
