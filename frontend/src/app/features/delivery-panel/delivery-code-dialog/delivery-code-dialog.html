<h2 bbDialogTitle>Delivery code</h2>
<form [formRoot]="form" novalidate>
  <div class="bb-dialog__content">
    <p class="bb-muted">
      Ask {{ order.deliveryAddress.recipientName || 'the customer' }} for the 4-digit code shown in
      their BiteBox app, and enter it to complete order {{ order.orderNumber }}.
    </p>
    @if (error(); as message) {
      <div class="bb-alert error" role="alert">
        <np-icon name="circle-alert" class="mat-icon" matButtonIcon /><span>{{ message }}</span>
      </div>
    }
    <div class="bb-field code">
      <np-input-otp
        [formField]="form.otp"
        [length]="4"
        [integerOnly]="true"
        [autofocus]="true"
        label="Delivery code"
      />
      <bb-field-error [field]="form.otp" />
    </div>
  </div>
  <div class="bb-dialog__actions">
    <np-button variant="text" severity="secondary" label="Cancel" (clicked)="ref.close()" />
    <button type="submit" class="bb-btn" [disabled]="form().submitting()">
      {{ form().submitting() ? 'Checking…' : 'Complete delivery' }}
    </button>
  </div>
</form>
