<header class="bb-form-heading">
  <h1>Forgot your password?</h1>
  <p>Enter the email you signed up with and we'll send you a reset link.</p>
</header>

@if (sentMessage()) {
  <div class="bb-alert success" role="status">
    <np-icon name="mail-check" class="mat-icon" matButtonIcon />
    <span>{{ sentMessage() }} The link expires in 30 minutes.</span>
  </div>
}
@if (error()) {
  <div class="bb-alert error" role="alert">
    <np-icon name="circle-alert" class="mat-icon" matButtonIcon />
    <span>{{ error() }}</span>
  </div>
}

<form class="bb-form" [formRoot]="form">
  <np-text-input
    [formField]="form.email"
    label="Email"
    type="email"
    icon="mail"
    placeholder="Enter your email address"
    autocomplete="email"
    inputmode="email"
    [error]="shownError(form.email)"
  />
  <div class="bb-form-actions">
    <button mat-flat-button type="submit" [disabled]="form().submitting()">
      @if (form().submitting()) {
        <mat-progress-spinner mode="indeterminate" diameter="20" aria-label="Sending" />
      } @else {
        {{ sentMessage() ? 'Send again' : 'Send reset link' }}
      }
    </button>
  </div>
</form>

<footer class="bb-form-footer">
  <span>Remembered it? <a routerLink="/login">Back to sign in</a></span>
</footer>
