<header class="bb-form-heading">
  <h1>Choose a new password</h1>
  <p>Signing in again will be required on all your devices.</p>
</header>

@if (!resetToken()) {
  <div class="bb-alert error" role="alert">
    <mat-icon aria-hidden="true">link_off</mat-icon>
    <span>This reset link is missing its token. Please request a new link.</span>
  </div>
  <a mat-flat-button routerLink="/forgot-password" class="bb-full-width">Request a new link</a>
} @else {
  @if (error()) {
    <div class="bb-alert error" role="alert">
      <mat-icon aria-hidden="true">error</mat-icon>
      <span>{{ error() }} <a routerLink="/forgot-password">Request a new link</a></span>
    </div>
  }
  <form class="bb-form" [formRoot]="form">
    <np-text-input
      [formField]="form.password"
      label="New password"
      type="password"
      icon="lock"
      autocomplete="new-password"
      hint="At least 8 characters, with a letter and a number"
      [error]="shownError(form.password)"
    />
    <np-text-input
      [formField]="form.confirmPassword"
      label="Confirm new password"
      type="password"
      icon="lock"
      placeholder="••••••••"
      autocomplete="new-password"
      [error]="shownError(form.confirmPassword)"
    />
    <div class="bb-form-actions">
      <button mat-flat-button type="submit" [disabled]="form().submitting()">
        @if (form().submitting()) {
          <mat-progress-spinner mode="indeterminate" diameter="20" aria-label="Saving" />
        } @else {
          Update password
        }
      </button>
    </div>
  </form>
}
