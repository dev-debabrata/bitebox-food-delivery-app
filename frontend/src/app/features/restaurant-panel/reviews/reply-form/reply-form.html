<form [formRoot]="form" novalidate class="reply-form">
  @if (error()) {
    <div class="bb-alert error" role="alert">
      <np-icon name="circle-alert" class="mat-icon" matButtonIcon /><span>{{ error() }}</span>
    </div>
  }
  <div class="bb-field">
    <np-textarea
      [formField]="form.text"
      [label]="'Public reply to ' + review().authorName"
      placeholder="Thank them, or explain what you'll do differently"
      rows="3"
      autoResize
    />
    <bb-field-error [field]="form.text" />
  </div>
  <p class="bb-muted note">Everyone can see your reply under the review. Keep it polite and don't share customer details.</p>
  <div class="actions">
    <button mat-button type="button" (click)="cancelled.emit()">Cancel</button>
    <button mat-flat-button type="submit" [disabled]="form().submitting()">
      {{ form().submitting() ? 'Posting…' : review().response ? 'Save reply' : 'Post reply' }}
    </button>
  </div>
</form>
