<h2 bbDialogTitle>{{ data.item ? 'Edit dish' : 'Add a dish' }}</h2>
<form [formRoot]="form">
  <div class="bb-dialog__content bb-form">
    @if (error()) {
      <div class="bb-alert error" role="alert">
        <np-icon name="circle-alert" class="mat-icon" matButtonIcon /><span>{{ error() }}</span>
      </div>
    }
    <np-text-input
      [formField]="form.name"
      label="Dish name"
      cdkFocusInitial
      [error]="shownError(form.name)"
    />
    <div class="bb-form-row">
      <div class="bb-field">
        <np-select [formField]="form.category" label="Category" placeholder="Choose a category" [options]="categoryOptions" />
        <bb-field-error [field]="form.category" />
      </div>
      <div class="bb-field">
        <np-input-number
          [formField]="form.price"
          label="Price"
          prefix="₹ "
          [maxFractionDigits]="2"
        />
        <bb-field-error [field]="form.price" />
      </div>
    </div>
    <div class="bb-field">
      <np-textarea
        [formField]="form.description"
        label="Description (optional)"
        rows="2"
        autoResize
      />
      <bb-field-error [field]="form.description" />
    </div>
    <div class="row">
      <np-button-toggle [formField]="form.isVeg" [options]="vegOptions" ariaLabel="Veg or non-veg" />
      <div class="bb-field">
        <np-input-number
          [formField]="form.prepTimeMinutes"
          label="Prep time"
          suffix=" min"
          [maxFractionDigits]="0"
        />
        <bb-field-error [field]="form.prepTimeMinutes" />
      </div>
    </div>
    <np-toggle class="bb-toggle-success" [formField]="form.isAvailable" label="Available to order" />
    <bb-image-upload [(url)]="imageUrl" label="Add a dish photo" aspectRatio="4 / 3" />
  </div>
  <div class="bb-dialog__actions">
    <np-button variant="soft" severity="secondary" label="Cancel" (clicked)="ref.close()" />
    <button type="submit" class="bb-btn" [disabled]="form().submitting()">
      @if (form().submitting()) {
        <np-spinner size="small" label="Saving" />
      } @else {
        {{ data.item ? 'Save' : 'Add dish' }}
      }
    </button>
  </div>
</form>
