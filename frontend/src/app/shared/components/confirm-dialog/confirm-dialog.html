<h2 mat-dialog-title>{{ data.title }}</h2>
<form [formRoot]="form">
  <mat-dialog-content>
    <p>{{ data.message }}</p>
    @if (data.reasonLabel) {
      <np-textarea [formField]="form.reason" [label]="data.reasonLabel" rows="3" autoResize cdkFocusInitial />
      <bb-field-error [field]="form.reason" />
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="undefined">Cancel</button>
    <button mat-flat-button type="submit" [class.danger]="data.danger">
      {{ data.confirmLabel ?? 'Confirm' }}
    </button>
  </mat-dialog-actions>
</form>
