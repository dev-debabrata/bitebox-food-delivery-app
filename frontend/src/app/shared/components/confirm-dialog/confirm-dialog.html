<h2 bbDialogTitle>{{ data.title }}</h2>
<form [formRoot]="form">
  <div class="bb-dialog__content">
    <p>{{ data.message }}</p>
    @if (data.reasonLabel) {
      <np-textarea
        [formField]="form.reason"
        [label]="data.reasonLabel"
        rows="3"
        autoResize
        cdkFocusInitial
      />
      <bb-field-error [field]="form.reason" />
    }
  </div>
  <div class="bb-dialog__actions">
    <np-button variant="soft" severity="secondary" label="Cancel" (clicked)="ref.close()" />
    <button type="submit" class="bb-btn" [class.bb-btn--danger]="data.danger">
      {{ data.confirmLabel ?? 'Confirm' }}
    </button>
  </div>
</form>
