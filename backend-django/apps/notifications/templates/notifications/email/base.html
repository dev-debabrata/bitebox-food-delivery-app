<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f6f3f8;font-family:Arial,Helvetica,sans-serif;color:#2e1a3d">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:16px">
      <tr>
        <td style="padding:24px 28px 8px">
          <strong style="font-size:20px;color:#2e1a3d">BiteBox</strong>
        </td>
      </tr>
      <tr>
        <td style="padding:8px 28px 24px;font-size:15px;line-height:1.5">
          <p style="margin:0 0 12px">Hi {{ name }},</p>
          <h1 style="margin:0 0 8px;font-size:20px">{{ title }}</h1>
          {% if body %}<p style="margin:0 0 20px">{{ body }}</p>{% endif %}
          <a href="{{ url }}" style="display:inline-block;padding:12px 22px;border-radius:12px;background:#2e1a3d;color:#ffffff;text-decoration:none;font-weight:bold">Open BiteBox</a>
        </td>
      </tr>
      <tr>
        <td style="padding:16px 28px 24px;font-size:12px;color:#6b5a78;border-top:1px solid #eee6f2">
          You get this email because of your BiteBox account. Change which emails you get in Account, Notifications.
        </td>
      </tr>
    </table>
  </body>
</html>
