# Local development stack for the Django API: PostgreSQL + PostGIS, Redis, the API (with reload),
# a Celery worker and Celery beat.
#
#   cd backend-django && cp .env.example .env
#   docker compose up --build
#   docker compose run --rm api migrate
#
# The API is on http://localhost:8000 (Swagger at /api/docs). The Node API keeps :5000, so both
# can run side by side during the migration.

x-app: &app
  build: .
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.development
    DATABASE_URL: postgres://bitebox:bitebox@db:5432/bitebox
    REDIS_URL: redis://redis:6379/0
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: bitebox
      POSTGRES_USER: bitebox
      POSTGRES_PASSWORD: bitebox  # local development only
    ports:
      - "127.0.0.1:5432:5432"  # loopback only, never on the LAN
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitebox -d bitebox"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    command: ["uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    entrypoint: []
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    command: ["worker"]

  beat:
    <<: *app
    command: ["beat"]

volumes:
  pg-data:
