# BiteBox reverse proxy: one public origin for the web app and the API.
# /api, /socket.io and /uploads go to the API; everything else to the Angular SSR server.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream bitebox_api { server api:5000; }
upstream bitebox_web { server web:4000; }

server {
  listen 80;
  server_name _;

  # Image uploads are capped at 2 MB by the API; leave room for the multipart envelope.
  client_max_body_size 6m;  # KYC documents up to 5 MB (images 2 MB, checked by the API)

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    proxy_pass http://bitebox_api;
  }

  # Live order updates and rider positions (WebSocket, with long-polling fallback).
  location /socket.io/ {
    proxy_pass http://bitebox_api;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  # Locally stored images (only used when Cloudinary is not configured).
  location /uploads/ {
    proxy_pass http://bitebox_api;
  }

  location / {
    proxy_pass http://bitebox_web;
  }
}
