# Production-like stack: MongoDB (single-node replica set, so transactions work),
# the API, the Angular SSR web app and an nginx reverse proxy on http://localhost:8080.
#
#   cp deploy/.env.example deploy/.env    # then set JWT_SECRET (and optional keys)
#   docker compose --env-file deploy/.env up -d --build
#
# Seed demo data once (fictional accounts):
#   docker compose --env-file deploy/.env exec -e NODE_ENV=development -e SEED_PASSWORD='Demo-pass-123' api node src/scripts/seed.js

services:
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Starts the replica set on first boot, then reports healthy once it has a primary.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/bitebox?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env}
      CLIENT_URL: ${PUBLIC_URL:-http://localhost:8080}
      PUBLIC_BASE_URL: ${PUBLIC_URL:-http://localhost:8080}
      TRUST_PROXY: 1
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:support@example.com}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-BiteBox <no-reply@example.com>}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY in deploy/.env}
    volumes:
      - uploads:/app/uploads
      # KYC documents: never served by URL, only through the API.
      - private-uploads:/app/private-uploads
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      PORT: 4000
      TRUST_PROXY: 1
      # Server rendering talks to the API directly inside the Docker network.
      API_INTERNAL_URL: http://api:5000
      # Host names the SSR server answers for (Angular's SSRF protection); comma-separated.
      NG_ALLOWED_HOSTS: ${PUBLIC_HOST:-localhost}
    depends_on:
      - api
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  mongo-data:
  uploads:
  private-uploads:
