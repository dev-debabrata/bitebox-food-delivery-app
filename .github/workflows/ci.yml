# Lint, test and build both apps on every push and pull request.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      # Uses an in-memory MongoDB (mongodb-memory-server); no database service needed.
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Low: quill (pulled in by nexprime, editor unused; no fixed release yet). See docs/SECURITY.md.
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm test -- --watch=false
      - run: npm run build

  # Django API (backend-django/, replacing backend/ phase by phase; see docs/django-migration/).
  backend-django:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-django
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: bitebox_test
          POSTGRES_USER: bitebox
          POSTGRES_PASSWORD: bitebox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bitebox -d bitebox_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      TEST_DATABASE_URL: postgres://bitebox:bitebox@localhost:5432/bitebox_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-django/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yml
      - run: pytest
      - name: Production settings pass Django's deploy checklist
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdefghij
          DJANGO_ALLOWED_HOSTS: api.bitebox.example
          JWT_SECRET: ci-only-jwt-secret-not-real-0123456789abcdef
          FIELD_ENCRYPTION_KEY: Y2ktb25seS1ub3QtYS1yZWFsLWtleS0wMTIzNDU2Nzg=
          SMTP_HOST: smtp.example.invalid
          DATABASE_URL: postgres://bitebox:bitebox@localhost:5432/bitebox_test
        run: python manage.py check --deploy --fail-level WARNING
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements/base.txt -r requirements/prod.txt
